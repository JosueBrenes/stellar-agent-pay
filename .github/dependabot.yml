version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      x402:
        patterns:
          - '@x402/*'
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 is the native compiler port. It does not pick up @types/node
      # in this project, which breaks the typecheck. Revisit deliberately.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Workflows track the floating major tag, which is what GitHub recommends
      # for CodeQL. Patch and minor bumps would only add churn.
      - dependency-name: github/codeql-action
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
    commit-message:
      prefix: 'ci'

name: npm audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so advisories published after the last commit still get caught.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: fail on high severity advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: npm audit --audit-level=high
        run: npm audit --audit-level=high
